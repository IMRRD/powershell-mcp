name: Publish to npm

# Publishes @imrrd/powershell-mcp from an immutable version tag,
# or manually via the Actions tab. Auth uses npm Trusted Publishing (OIDC) -
# no NPM_TOKEN secret, and OIDC publishes are exempt from npm's 2FA prompt.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing + provenance

jobs:
  cross-engine-gate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: cross-engine-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org

      # Trusted publishing/OIDC needs a recent npm
      - name: Upgrade npm
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Install pinned supervisor compiler
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: scripts/supervisor-build/global.json
      - name: Restore and verify locked supervisor reference pack
        run: npm run supervisor:restore
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
      - name: Require packed supervisor on PowerShell 7.0.0 / .NET Core 3.1
        run: npm run test:supervisor-compat

      - name: Test with explicit discovery counts
        shell: bash
        run: |
          set -euo pipefail
          npm test -- --reporter=json --outputFile=vitest-report.json
          node scripts/check-test-report.mjs vitest-report.json

      - name: Isolated collector fixtures (explicit nonzero discovery)
        run: node scripts/check-collector-tests.mjs
      - name: Verify installed canonical tarball over MCP stdio
        env:
          MCP_REQUIRED_ENGINE: pwsh
          POWERSHELL_MCP_NO_TELEMETRY: '1'
        run: node scripts/installed-smoke.mjs

      - name: Publish
        run: npm publish --access public --provenance