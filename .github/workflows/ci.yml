name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

jobs:
  analytics-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: analytics_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ANALYTICS_TEST_DSN: postgresql://postgres:fixture-only@localhost:5432/analytics_fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]==3.3.6'
      - run: python -m unittest discover -s collector/analytics -v
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            engine: powershell
          - os: windows-latest
            engine: pwsh
          - os: ubuntu-latest
            engine: pwsh
    runs-on: ${{ matrix.os }}
    env:
      MCP_REQUIRED_ENGINE: ${{ matrix.engine }}
      POWERSHELL_MCP_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Require selected engine
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MCP_REQUIRED_ENGINE" == powershell ]]; then
            command -v powershell.exe
            powershell.exe -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
          else
            command -v pwsh
            pwsh -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test with explicit discovery counts
        shell: bash
        run: |
          set -euo pipefail
          npm test -- --reporter=json --outputFile=vitest-report.json || {
            node -e "const r=require('./vitest-report.json'); for(const s of r.testResults||[]) for(const t of s.assertionResults||[]) if(t.status==='failed') console.error(t.fullName, ...(t.failureMessages||[]));"
            exit 1
          }
          node scripts/check-test-report.mjs vitest-report.json
      - name: Isolated collector fixtures (explicit nonzero discovery)
        run: node scripts/check-collector-tests.mjs
      - name: Pack, install and exercise the actual artifact over MCP stdio
        run: node scripts/installed-smoke.mjs
