name: Publish legacy security forwarder

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powershell-mcp-legacy-security-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'IMRRD/powershell-mcp' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'isak-ialogics' &&
      github.triggering_actor == 'isak-ialogics'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact main release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pinned npm client
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org

      - name: Install pinned npm
        run: npm install -g npm@11.6.2

      - name: Verify package-scoped authorization and canonical fix
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_LEGACY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN"
          test "$(npm whoami)" = 'isak_imrrd.com'
          test "$(npm view @imrrd/powershell-mcp version)" = '0.5.3'

      - name: Verify legacy compatibility package
        working-directory: compat/powershell-mcp
        run: |
          npm install --ignore-scripts
          npm audit --audit-level=high
          npm pack --dry-run

      - name: Publish legacy compatibility release exactly once
        working-directory: compat/powershell-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_LEGACY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          observed="$(npm view powershell-mcp@0.3.3 version 2>/dev/null || true)"
          if [[ -z "$observed" ]]; then
            npm publish --access public
          else
            test "$observed" = '0.3.3'
          fi

      - name: Deprecate the legacy line with safe-version guidance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_LEGACY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm deprecate 'powershell-mcp@*' \
            'Deprecated package. Upgrade to powershell-mcp@0.3.3 or @imrrd/powershell-mcp@0.5.3 or later.'

      - name: Verify forwarding and deprecation
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm view powershell-mcp@0.3.3 version)" = '0.3.3'
          test "$(npm view powershell-mcp@0.3.3 dependencies.@imrrd/powershell-mcp)" = '^0.5.3'
          for version in 0.3.0 0.3.1 0.3.2 0.3.3; do
            message="$(npm view "powershell-mcp@${version}" deprecated)"
            [[ "$message" == *'@imrrd/powershell-mcp@0.5.3'* ]]
          done
