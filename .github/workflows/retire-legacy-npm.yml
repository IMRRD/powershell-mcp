name: Retire legacy npm package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powershell-mcp-legacy-npm-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.repository == 'IMRRD/powershell-mcp' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'isak-ialogics' &&
      github.triggering_actor == 'isak-ialogics'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact main cleanup source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pinned npm client
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org

      - name: Install pinned npm
        run: npm install -g npm@11.6.2

      - name: Verify package-scoped authorization and canonical release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_LEGACY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN"
          test "$(npm whoami)" = 'isak_imrrd.com'
          test "$(npm view @imrrd/powershell-mcp version)" = '0.5.2'

      - name: Verify legacy compatibility package
        working-directory: compat/powershell-mcp
        run: |
          npm install --ignore-scripts
          npm audit --audit-level=high
          npm pack --dry-run

      - name: Publish legacy compatibility release exactly once
        working-directory: compat/powershell-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_LEGACY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          observed="$(npm view powershell-mcp@0.3.2 version 2>/dev/null || true)"
          if [[ -z "$observed" ]]; then
            npm publish --access public
          else
            test "$observed" = '0.3.2'
          fi

      - name: Deprecate every unscoped version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_LEGACY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm deprecate 'powershell-mcp@*' \
            'This package has moved to @imrrd/powershell-mcp. Install with: npm install -g @imrrd/powershell-mcp'

      - name: Verify legacy forwarding and deprecation
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm view powershell-mcp@0.3.2 version)" = '0.3.2'
          for version in 0.3.0 0.3.1 0.3.2; do
            message="$(npm view "powershell-mcp@${version}" deprecated)"
            [[ "$message" == *'@imrrd/powershell-mcp'* ]]
          done
